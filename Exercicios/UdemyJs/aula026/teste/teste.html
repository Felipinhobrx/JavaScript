<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste append child create element</title>
    <style>
        body {
            background-color: rgb(0, 89, 95);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        main {
            background-color: white;
            border: 1px solid black;
            border-radius: 5px;

            font-size: 1.2em;

            margin: auto;
            margin-top: 150px;
            width: 500px;
        }
    </style>
</head>
<body>
    <main id="container">
        <h1>Append child, create element</h1>
        <button onclick="criaImg()">Clique em mim</button>
    </main>

    <script>
        const container = document.getElementById('container')

        function criaImg() {
            let img = document.createElement('img')
            img.appendChild('img.jpg')
            container.appendChild(img)
        }
    </script>
</body>
</html>
