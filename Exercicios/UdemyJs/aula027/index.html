<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exx nodeList</title>
    <style>
        body {
            background-color: rgb(0, 89, 95);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        main {
            background-color: white;
            border: 3px solid rgb(255, 0, 0);
            border-radius: 5px;

            font-size: 1.2em;

            margin: auto;
            margin-top: 150px;
            width: 500px;
        }
    </style>
</head>
<body>
    <main id="container">
        <h1></h1>

        <div class="paragrafos">
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>

            <p>Dolorem veritatis optio vitae incidunt consequatur quidem! Cum, non.</p>

            <p>dolorum! Velit ea voluptate, eveniet quae natus voluptatum accusantium tenetur sequi</p>

            <p>suscipit possimus officiis delectus, distinctio quo rem aliquam.</p> 
        </div>

    </main>

    <script>
        const paragrafos = document.querySelector('.paragrafos')
        const p = paragrafos.querySelectorAll('p')

        const EstiloBody = getComputedStyle(document.body)
        let bodyCor = EstiloBody.backgroundColor

        for (let c in p) {
            p[c].style.backgroundColor = bodyCor
            p[c].style.color = '#FFFFFF'
        }
    </script>
</body>
</html>
